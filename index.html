 <!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ڕێبەرێ زانکۆیێ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #eff3f6;
            overflow: hidden; 
            height: 100vh;
        }

        #welcome-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(26, 35, 126, 0.7)), 
                        url('zanko.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
            text-align: center;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .welcome-content i { 
            font-size: 90px; margin-bottom: 20px; color: #ffd700; 
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .start-btn {
            margin-top: 40px; padding: 18px 60px; font-size: 26px; font-weight: bold;
            color: #1a237e; background: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255,255,255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255, 0); } }

        .main-content {
            height: 100vh; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; transition: opacity 1s ease;
        }

        header { margin-bottom: 30px; margin-top: 20px; text-align: center; }
        .main-title { color: #1a237e; font-size: 32px; margin-bottom: 5px; }

        .buttons-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            width: 100%; max-width: 600px; padding-bottom: 50px;
        }

        /* لێرە گۆڕانکاری لۆ شین بوون هاتە کرن */
        .dept-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px 10px; font-size: 18px; font-family: 'Vazirmatn'; font-weight: 600;
            border: none; border-radius: 20px; background: white; color: #1a237e;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
            cursor: pointer;
        }

        .dept-btn i { font-size: 35px; margin-bottom: 12px; color: #1a73e8; transition: all 0.3s ease; }

        /* دەمێ دەست یان ماوس دچیتە سەر دوگمێ دێ شین بیت */
        .dept-btn:hover {
            background-color: #1a237e;
            color: white;
            transform: translateY(-5px);
        }

        .dept-btn:hover i {
            color: #ffd700; /* ئایکۆن دبیتە زەرد ل سەر شینی */
        }

        .dept-btn:active { transform: scale(0.95); }

        /* Modal for Video - Responsive Design */
        .modal {
            display: none; position: fixed; z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
        }

        .video-container { 
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #youtubePlayer {
            width: 90%; max-width: 800px; aspect-ratio: 16 / 9;
            border: none; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .video-info { 
            width: 100%;
            padding: 20px; color: white; background: #1a237e;
            border-top: 3px solid #ffd700; text-align: center;
        }

        .close-btn {
            position: absolute; top: 20px; left: 20px; color: white; 
            font-size: 30px; z-index: 4000; background: rgba(255,255,255,0.2);
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body onclick="resetTimer()">

    <div id="welcome-screen">
        <div class="welcome-content">
            <i class="fas fa-graduation-cap"></i>
            <h1>بەخێربێن بۆ ڕێبەرێ زانکۆیا<br>کارگێڕی و ئابووری</h1>
            <p>بۆ دەسپێکرن، کلیک ل سەر دوگمێ بکە</p>
            <button class="start-btn" onclick="startApp()">دەسپێک</button>
        </div>
    </div>

    <div id="app-content" class="main-content">
        <header>
            <h1 class="main-title"><i class="fas fa-university"></i> ڕێبەرێ زانکۆیێ</h1>
            <p>تکایە جهێ مەبەست هەلبژێرە</p>
        </header>

        <div class="buttons-grid" id="buttonsGrid">
            <!-- Buttons will be loaded from Firebase -->
        </div>
    </div>

    <div id="videoModal" class="modal">
        <span class="close-btn" onclick="closeVideo()"><i class="fas fa-times"></i></span>
        <div class="video-container">
            <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            <div class="video-info">
                <h2 id="dept-name" style="color: #ffd700; margin-bottom: 5px;"></h2>
                <p id="dept-desc" style="font-size: 18px;"></p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAdBRnoL2f8XEPBhSmuc58C-LPpCtjc_Ik",
            authDomain: "administrationeconomics.firebaseapp.com",
            projectId: "administrationeconomics",
            storageBucket: "administrationeconomics.firebasestorage.app",
            messagingSenderId: "45463459254",
            appId: "1:45463459254:web:f9137c2700634eecf51d17",
            measurementId: "G-65M4ET0ZGP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let idleTimer;

        function startApp() {
            document.getElementById('welcome-screen').style.transform = 'translateY(-100%)';
            setTimeout(() => {
                document.getElementById('app-content').style.opacity = '1';
                loadDepartments();
                resetTimer();
            }, 300);
        }

        async function loadDepartments() {
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '<p style="color: #1a237e; grid-column: 1 / span 2;">لێگەریان ل داتایان دکەت...</p>';
            
            try {
                const snapshot = await db.collection('departments').get();
                grid.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement('button');
                    btn.className = 'dept-btn';
                    btn.onclick = () => playVideo(data.youtubeUrl, data.name, data.desc);
                    btn.innerHTML = `<i class="${data.icon || 'fas fa-graduation-cap'}"></i>${data.name}`;
                    grid.appendChild(btn);
                });
            } catch (error) {
                console.error("Error loading docs: ", error);
                grid.innerHTML = '<p>خەلەتیەک ڕوویدا لە کاتی بارکردنی زانیارییەکان</p>';
            }
        }

        function playVideo(url, name, desc) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('youtubePlayer');
            
            // Convert YouTube URL to Embed format
            let videoId = "";
            if (url.includes("v=")) {
                videoId = url.split("v=")[1].split("&")[0];
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1];
            }
            
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('dept-name').innerText = name;
            document.getElementById('dept-desc').innerText = desc;
            modal.style.display = "block";
        }

        function closeVideo() {
            const player = document.getElementById('youtubePlayer');
            player.src = ""; // Stop video
            document.getElementById('videoModal').style.display = "none";
        }

        function resetTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                closeVideo();
                document.getElementById('welcome-screen').style.transform = 'translateY(0)';
                document.getElementById('app-content').style.opacity = '0';
            }, 120000); 
        }
    </script>
</body>
</html>
